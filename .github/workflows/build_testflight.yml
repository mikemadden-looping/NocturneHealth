name: 2. Build to TestFlight
run-name: Build to TestFlight (${{ github.ref_name }})

on:
  workflow_dispatch:
  schedule:
    - cron: "57 8 * * 0"  # weekly rebuild (Sundays) so the TestFlight build never hits its 90-day expiry

env:
  TEAMID: ${{ secrets.TEAMID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

jobs:
  keepalive:
    # GitHub disables scheduled workflows after 60 days without repo activity.
    # If nothing has been pushed in 45 days, push an empty commit to a side branch.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Keep scheduled builds alive
        run: |
          git fetch --depth=1 origin keepalive 2>/dev/null || true
          last=$(git log -1 --format=%ct HEAD)
          if git rev-parse -q --verify origin/keepalive >/dev/null; then
            ka=$(git log -1 --format=%ct origin/keepalive)
            [ "$ka" -gt "$last" ] && last=$ka
          fi
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Days since last push: $age"
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive for scheduled builds"
            git push --force origin HEAD:keepalive
          fi

  build:
    runs-on: macos-26
    steps:
      - name: Check secrets
        run: |
          missing=""
          for s in TEAMID GH_PAT MATCH_PASSWORD FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Add them under Settings → Secrets and variables → Actions (repository or organization)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select --switch "$XCODE/Contents/Developer"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install fastlane
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Build and sign
        run: bundle exec fastlane build_app_ipa

      - name: Upload to TestFlight
        run: bundle exec fastlane release

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: buildlog
          path: buildlog
