name: NocturneHealth
options:
  bundleIdPrefix: com.mikemadden
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    VERSIONING_SYSTEM: apple-generic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NocturneHealth:
    type: application
    platform: iOS
    sources:
      - NocturneHealth
    scheme: {}
    info:
      path: NocturneHealth/Info.plist
      properties:
        CFBundleDisplayName: Nocturne Health
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Nocturne Health reads your steps, heart rate and workouts so it can copy them to your Nocturne site.
        NSHealthUpdateUsageDescription: Nocturne Health does not write to Apple Health.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - nocturnehealth.refresh
    entitlements:
      path: NocturneHealth/NocturneHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemadden.NocturneHealth
        PRODUCT_NAME: NocturneHealth
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
